name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check:booster-package
      - run: npm run check:docs
      - name: Append reference Flow summaries
        shell: bash
        run: |
          printf '## Reference case: complete\n\n' >> "$GITHUB_STEP_SUMMARY"
          node dist/cli.js assess-flow --input examples/flow/assess-complete.json --format markdown >> "$GITHUB_STEP_SUMMARY"

          printf '\n## Reference case: waiting\n\n' >> "$GITHUB_STEP_SUMMARY"
          node dist/cli.js assess-flow --input examples/flow/assess-after-plan.json --format markdown >> "$GITHUB_STEP_SUMMARY" && waiting_exit=0 || waiting_exit=$?
          if [ "$waiting_exit" -ne 2 ]; then
            echo "Expected exit 2 for waiting, got $waiting_exit." >&2
            exit 1
          fi

          printf '\n## Reference case: foreign receipt\n\n' >> "$GITHUB_STEP_SUMMARY"
          node dist/cli.js assess-flow --input examples/flow/assess-foreign-receipt.json --format markdown >> "$GITHUB_STEP_SUMMARY" && foreign_exit=0 || foreign_exit=$?
          if [ "$foreign_exit" -ne 2 ]; then
            echo "Expected exit 2 for foreign receipt, got $foreign_exit." >&2
            exit 1
          fi
