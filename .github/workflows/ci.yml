name: CI
on:
  pull_request:
    paths-ignore:
      - "README.md"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "**/*.md"
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:docs
      - run: npm test
      - name: Install website dependencies
        run: npm ci
        working-directory: website
      - name: Lint website
        run: npm run lint
        working-directory: website
      - name: Build and test website
        run: npm test
        working-directory: website
